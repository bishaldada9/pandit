version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hindu-ritual-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ritual_user
      - DB_PASSWORD=${DB_PASSWORD:-ritual_pass_secure}
      - DB_NAME=hindu_ritual_db
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-refresh-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ritual-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hindu-ritual-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - ritual-network

  postgres:
    image: postgres:16-alpine
    container_name: hindu-ritual-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ritual_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ritual_pass_secure}
      - POSTGRES_DB=hindu_ritual_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ritual_user -d hindu_ritual_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ritual-network

  redis:
    image: redis:7-alpine
    container_name: hindu-ritual-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ritual-network

volumes:
  postgres-data:
  redis-data:

networks:
  ritual-network:
    driver: bridge
